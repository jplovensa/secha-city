name: Deploy SECHA City
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: ${{ env.PAGES_ARTIFACT }}
      - name: Wait for the Pages artifact to be visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" |
              jq -e --arg name "$PAGES_ARTIFACT" 'any(.artifacts[]; .name == $name and (.expired | not))' > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "Pages artifact $PAGES_ARTIFACT is still unavailable"
          exit 1
      - uses: actions/deploy-pages@v4
        id: deploy
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}
